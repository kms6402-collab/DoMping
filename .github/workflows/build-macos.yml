name: Build macOS DMGs (DoMping.Avalonia)

# Windows can't produce a real macOS package: codesign and hdiutil (DMG creation) only exist on
# macOS itself. This workflow runs on a GitHub-hosted macOS runner to build, ad-hoc code-sign,
# and package DoMping.Avalonia as a proper .app inside a .dmg, then attaches the DMGs to the
# given release. Manual trigger only - it does not run automatically on push.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the DMGs to (must already exist)"
        required: true
        default: "avalonia-port-v1.12.1-phase3"
      app_version:
        description: "CFBundleShortVersionString / CFBundleVersion"
        required: true
        default: "1.12.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: |
          dotnet publish DoMping.Avalonia/DoMping.Avalonia.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false

      - name: Build .app icon (from app.ico)
        run: |
          brew install imagemagick >/dev/null
          mkdir -p icon.iconset
          magick app.ico -resize 512x512 icon-512.png
          for size in 16 32 64 128 256 512; do
            magick icon-512.png -resize ${size}x${size} icon.iconset/icon_${size}x${size}.png
            double=$((size*2))
            if [ $double -le 1024 ]; then
              magick icon-512.png -resize ${double}x${double} icon.iconset/icon_${size}x${size}@2x.png
            fi
          done
          iconutil -c icns icon.iconset -o DoMping.icns

      - name: Assemble .app bundle
        run: |
          APP="DoMping.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -a "DoMping.Avalonia/bin/Release/net10.0/${{ matrix.rid }}/publish/." "$APP/Contents/MacOS/"
          cp DoMping.icns "$APP/Contents/Resources/DoMping.icns"
          chmod +x "$APP/Contents/MacOS/DoMping.Avalonia"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DoMping.Avalonia</string>
              <key>CFBundleIconFile</key>
              <string>DoMping.icns</string>
              <key>CFBundleIdentifier</key>
              <string>com.kms6402collab.domping</string>
              <key>CFBundleName</key>
              <string>DoMping</string>
              <key>CFBundleDisplayName</key>
              <string>DoMping</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ inputs.app_version }}</string>
              <key>CFBundleVersion</key>
              <string>${{ inputs.app_version }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>LSApplicationCategoryType</key>
              <string>public.app-category.utilities</string>
          </dict>
          </plist>
          PLIST

      - name: Ad-hoc code sign
        run: |
          codesign --force --deep --sign - "DoMping.app"
          codesign --verify --deep --strict "DoMping.app"

      - name: Build DMG
        run: |
          mkdir -p dmg-root
          cp -R "DoMping.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "DoMping" -srcfolder dmg-root -ov -format UDZO \
            "DoMping-${{ inputs.app_version }}-${{ matrix.rid }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: DoMping-${{ matrix.rid }}-dmg
          path: DoMping-*.dmg

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release_tag }}" "DoMping-${{ inputs.app_version }}-${{ matrix.rid }}.dmg" \
            --repo "${{ github.repository }}" --clobber
